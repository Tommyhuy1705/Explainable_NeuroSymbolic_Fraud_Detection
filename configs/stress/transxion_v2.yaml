project:
  name: explainable_neurosymbolic_fraud_detection
  experiment: transxion_v2_stress_test
  seed: 42
  output_dir: results/stress/transxion_v2
  claim_scope: difficult_aml_generalization_stress_test

dataset:
  name: transxion_v2
  canonical_dataset_name: TransXion
  paper_revision: v2
  # "v2" identifies revision 2 of the TransXion paper used by the thesis
  # proposal. The official repository does not publish a separate dataset-v2 tag.
  data_file: tx.csv
  target_column: Is Laundering
  time_column: Timestamp
  source_repository: https://github.com/chaos-max/TransXion
  source_paper: https://arxiv.org/abs/2604.17420v2
  license_status: verify_official_source_terms_before_redistribution
  source_revision: 53932595c37c23b9f55ea5ddf5984e4d57b88369
  checksum:
    algorithm: sha256
    value: d6c345f07a8d8e26123dba5fe4f6572ef198e04fb94f9b53facb3fef6d197a35
  verify_checksum: true
  add_history_features: true
  join_profiles: false
  profile_files: [person.csv, merchant.csv]
  leakage_denylist: [label]

split:
  strategy: timestamp_safe_temporal
  train_size: 0.60
  validation_size: 0.20
  test_size: 0.20
  validation_roles: [calibration_fit, calibration_select, rule_audit, policy_select]

preprocessing:
  max_missing_fraction: 0.95
  max_features: 100
  categorical_max_cardinality: 1000
  scale_numeric: true
  drop_columns:
    - label
    - event_time
    - __source_order
    - sender_account_id
    - receiver_account_id

models:
  families: [xgboost, lightgbm, tabular_resnet_v2]
  selection_metric: pr_auc
  # Stress datasets are supplementary and very large. One pre-registered
  # training seed per family keeps a full Kaggle run feasible; uncertainty in
  # selective policy is estimated separately by validation resampling and
  # paired temporal-block bootstrap.
  seeds: [42]
  xgboost:
    n_estimators: 500
    max_depth: 8
    learning_rate: 0.04
    subsample: 0.85
    colsample_bytree: 0.80
    min_child_weight: 2.0
    reg_lambda: 1.0
  lightgbm:
    n_estimators: 500
    num_leaves: 63
    learning_rate: 0.04
    subsample: 0.85
    subsample_freq: 1
    colsample_bytree: 0.85
    min_child_samples: 20
    reg_lambda: 1.0
  tabular_resnet_v2:
    hidden_dim: 192
    num_blocks: 4
    expansion_factor: 2
    dropout: 0.15
    epochs: 50
    batch_size: 4096
    learning_rate: 0.001
    weight_decay: 0.0001
    gradient_clip_norm: 5.0
  quick_overrides:
    tree_n_estimators: 25
    neural_epochs: 2
    neural_hidden_dim: 48
    neural_num_blocks: 2

evaluation:
  calibration_methods: [none, platt, isotonic]
  calibration_selection_metric: brier
  threshold_objective: f2
  beta: 2.0
  n_calibration_bins: 15
  recall_fpr: 0.01
  coverages: [0.05, 0.10, 0.25, 0.50]
  primary_coverages: [0.10, 0.25]
  bootstrap_iterations: 1000
  bootstrap_block: calendar_day
  confidence_level: 0.95
  matched_risk_bins: 20
  matched_risk_caliper: 0.02
  policy_resampling_seeds: [42, 123, 2026, 1705, 2027]
  minimum_score_only_delta: 0.005
  saturation_headroom: 0.05
  saturation_precision_margin: 0.02
  saturation_evidence_margin: 0.05
  minimum_positive_stability_fraction: 0.80
  minimum_saturation_alert_positives: 20
  minimum_saturation_matched_pairs: 20
  minimum_saturation_bootstrap_replicates: 200

logic:
  activation_threshold: 0.60
  max_jaccard: 0.85
  max_rules: 12
  fp_penalty: 1.0
  evidence_methods: [unweighted, audit_weighted, fp_penalized, attribution_gated, contrastive_meta, guarded_ensemble]
  contrastive_meta:
    enabled: true
    minimum_alert_rows: 50
    minimum_rows_per_class: 10
    regularization_c: 1.0
    max_iter: 1000
  guarded_ensemble:
    enabled: true
    aggregation: arithmetic_mean
    components: [fp_penalized, attribution_gated, contrastive_meta]
  audit_criteria:
    min_active_count: 20
    min_coverage: 0.001
    max_coverage: 0.50
    min_precision_gain: 0.0
    min_lift: 1.0
    min_tp_fp_gap: 0.0
    max_fp_activation: 0.50
    max_coverage_shift: 0.15
    max_lift_log_shift: 1.50
    min_attribution_hit_rate: 0.05
    min_attribution_share: 0.01
  policy_guardrails:
    minimum_supported_alert_fraction: 0.05
    minimum_evidence_tp_fp_gap: 0.0
    minimum_positive_region_fidelity: 0.50
    require_full_budget_support: true
    minimum_policy_stability_fraction: 0.60
  rules:
    - name: high_amount_paid
      tier: A
      description: The paid amount is extreme relative to the training period.
      conditions:
        - feature: amount_paid
          operator: greater_quantile
          value: 0.99
          softness: 0.15
    - name: rapid_sender_high_amount
      tier: A
      description: A sender transacts again unusually quickly with a high amount.
      conditions:
        - feature: sender_seconds_since_previous
          operator: less_quantile
          value: 0.05
          softness: 0.20
        - feature: amount_paid
          operator: greater_quantile
          value: 0.90
          softness: 0.20
    - name: new_counterparty_high_amount
      tier: A
      description: A high-value payment is sent across a previously unseen account pair.
      conditions:
        - feature: pair_prior_transaction_count
          operator: equals
          value: 0
        - feature: amount_paid
          operator: greater_quantile
          value: 0.90
          softness: 0.20
    - name: currency_mismatch_amount_difference
      tier: A
      description: Payment and receiving currencies differ and the amounts are inconsistent.
      conditions:
        - feature: same_currency
          operator: equals
          value: 0
        - feature: amount_relative_difference
          operator: greater
          value: 0.05
          softness: 0.02
    - name: cross_bank_high_amount
      tier: A
      description: A cross-bank transfer has an unusually high paid amount.
      conditions:
        - feature: cross_bank
          operator: equals
          value: 1
        - feature: amount_paid
          operator: greater_quantile
          value: 0.95
          softness: 0.20
    - name: risky_payment_format_high_amount
      tier: B
      description: A train-fitted risky payment format co-occurs with a high amount.
      conditions:
        - feature: payment_format
          operator: category_risk
          value: 0.70
          softness: 0.10
        - feature: amount_paid
          operator: greater_quantile
          value: 0.90
          softness: 0.20

counterfactual_candidates:
  enabled: true
  numeric_features:
    - amount_paid
    - amount_received
  non_intervenable_derived_features:
    - sender_seconds_since_previous
    - receiver_seconds_since_previous
    - pair_prior_transaction_count
  derived_feature_contract:
    amount_paid:
      - output: amount_paid_log
        formula: log1p_nonnegative
        inputs: [amount_paid]
      - output: amount_relative_difference
        formula: absolute_relative_difference
        inputs: [amount_paid, amount_received]
    amount_received:
      - output: amount_received_log
        formula: log1p_nonnegative
        inputs: [amount_received]
      - output: amount_relative_difference
        formula: absolute_relative_difference
        inputs: [amount_paid, amount_received]
  minimum_mean_score_drop: 0.002
  minimum_affected_fraction: 0.05
  minimum_tail_rows: 25
  rule_quantile: 0.95
  softness: 0.15
  max_rules: 5
  max_rows: 100000
  score_mode: raw

surrogate:
  enabled: true
  max_depth: 3
  min_samples_leaf: 100
  max_rules: 8
  target: score
  score_mode: calibrated

reporting:
  dataset_label: TransXion (paper revision v2)
  required_claim_flags: [checksum_verified, full_dataset, policy_locked_before_test, all_predictor_attributions_available]
  report_negative_results: true
  report_fallbacks: true
  report_saturation: true
